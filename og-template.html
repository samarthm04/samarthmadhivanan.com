<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:'Inter',sans-serif}
.wrap{width:1200px;height:630px;background:#1f3a2a;
  background-image:linear-gradient(rgba(198,227,107,0.09) 1px,transparent 1px),linear-gradient(90deg,rgba(198,227,107,0.09) 1px,transparent 1px);
  background-size:48px 48px;padding:80px 88px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.kick{font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:4px;color:#c6e36b;text-transform:uppercase}
h1{font-family:'Anton',sans-serif;font-size:132px;line-height:0.9;color:#f4ecd8;text-transform:uppercase;
  text-shadow:4px 4px 0 #141210,10px 10px 0 #e25a2a}
.sub{font-size:30px;color:rgba(244,236,216,0.9);max-width:900px;line-height:1.4}
.row{display:flex;gap:16px;align-items:center}
.tag{background:#c6e36b;color:#141210;border:2px solid #141210;font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;letter-spacing:2px;padding:8px 16px;text-transform:uppercase}
.dot{color:#e25a2a}
</style></head>
<body>
<div class="wrap">
  <div class="kick">// AI Systems Builder</div>
  <div>
    <h1>Samarth<br>Madhivanan<span class="dot">.</span></h1>
  </div>
  <div class="sub">Agentic AI systems and workflow automation. AI/ML Analyst at KPMG Digital Lighthouse, Mumbai.</div>
  <div class="row">
    <span class="tag">Agentic AI</span>
    <span class="tag">Workflow Automation</span>
    <span class="tag">Open for Freelance</span>
  </div>
</div>
</body></html>
